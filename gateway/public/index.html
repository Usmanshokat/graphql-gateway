<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphQL Gateway</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div>
        <h1>GraphQL Gateway</h1>
        <p class="subtitle">Products, Orders and Users in one place</p>
      </div>

      <div id="session" class="session" hidden>
        <div class="session-info">
          <strong id="session-name"></strong>
          <span id="session-email"></span>
        </div>
        <span id="session-role" class="role-badge"></span>
        <button type="button" id="logout-btn" class="btn btn-secondary">Logout</button>
      </div>
    </header>

    <div id="message" class="message" hidden></div>

    <!-- AUTH -->
    <section id="auth-view" class="auth-view">
      <div class="card auth-card">
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-auth="login">Login</button>
          <button type="button" class="auth-tab" data-auth="register">Register</button>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="Enter email" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter password" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <form id="register-form" hidden>
          <div class="form-group">
            <label for="register-name">Name</label>
            <input type="text" id="register-name" placeholder="Enter name" required />
          </div>
          <div class="form-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" placeholder="Enter email" required />
          </div>
          <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" placeholder="Enter password" required />
          </div>
          <p class="hint">New accounts get the USER role (read only). An admin can upgrade it.</p>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>
      </div>
    </section>

    <!-- DASHBOARD -->
    <section id="dashboard" hidden>
      <nav class="tabs">
        <button type="button" class="tab active" data-tab="products">Products</button>
        <button type="button" class="tab" data-tab="orders">Orders</button>
        <button type="button" class="tab" data-tab="users" data-admin-only>Users</button>
      </nav>

      <p id="readonly-note" class="readonly-note" hidden>
        You have read-only access. Only ADMIN and SUPER_ADMIN can add, edit or delete.
      </p>

      <!-- FORM (admins only) -->
      <section id="form-card" class="card" data-admin-only>
        <h2 id="form-title">Add New Product</h2>
        <form id="item-form">
          <input type="hidden" id="item-id" />
          <div id="form-fields"></div>
          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">Add</button>
            <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <!-- TABLE -->
      <section class="card">
        <div class="table-header">
          <h2 id="table-title">Products</h2>
          <button type="button" id="refresh-btn" class="btn btn-secondary btn-sm">Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </section>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
